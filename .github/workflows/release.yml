name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners where one exists. Both macOS targets are built on the Apple
          # Silicon runner because the Intel one does not: `macos-13` was GitHub's last
          # x86_64 image and it is gone, so a job asking for it waits for a machine that is
          # never allocated — v0.1.0's first attempt sat queued for five hours before this
          # was noticed. Apple's SDK carries both architectures, and nothing here links C,
          # so `--target x86_64-apple-darwin` on arm64 is an ordinary build.
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}
      - name: Install the musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Check the tag matches the manifest
        shell: bash
        run: |
          version=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' herdr-plugin.toml | head -n 1)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match herdr-plugin.toml version $version"
            exit 1
          fi

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          version=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' herdr-plugin.toml | head -n 1)
          archive="herdr-worktree-nav-$version-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C "target/${{ matrix.target }}/release" herdr-worktree-nav
          # sha256sum on Linux, shasum on macOS; both print "<hash>  <file>".
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.sha256

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Collect the checksums into one file
        # fetch-or-build.sh looks for a single SHA256SUMS next to the archives.
        run: cd dist && cat *.sha256 > SHA256SUMS && rm -f *.sha256 && cat SHA256SUMS

      - name: Take the release notes from the changelog
        # The newest released section — skipping `[Unreleased]`, dropping the heading because
        # GitHub already titles the release, and dropping the link definitions because they
        # render as nothing. Without this the notes are the auto-generated list of merged
        # pull requests, which says what landed but not what the plugin does.
        shell: bash
        run: |
          awk '/^## \[Unreleased\]/ { next }
               /^## \[/ { if (seen) exit; seen = 1; next }
               seen && !/^\[[^]]+\]: https?:/' CHANGELOG.md > NOTES.md
          test -s NOTES.md || { echo "no changelog section to release"; exit 1; }
          cat NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: NOTES.md
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          # Appended under the changelog, so the prose leads and the commit trail follows.
          generate_release_notes: true
