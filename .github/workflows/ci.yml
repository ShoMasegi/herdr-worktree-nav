name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # check-docs-sync compares against the base branch, so it needs the history.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: A locale git does not answer in English
        # tests/git_locale.rs proves the LC_ALL pin by running a git that would otherwise
        # answer in another language. This image lists C, C.utf8, POSIX and en_US.utf8 only,
        # and the test needs one git has a translation for. Written into locale.gen rather
        # than passed to locale-gen, which not every version takes as an argument, and
        # grepped afterwards so a locale that was not generated fails on this step, where
        # the cause is on screen, rather than two steps later as a locale test with nothing
        # to measure and only its own panic to say so.
        run: |
          sudo apt-get update
          sudo apt-get install -y locales
          echo 'de_DE.UTF-8 UTF-8' | sudo tee -a /etc/locale.gen
          sudo locale-gen
          locale -a | grep -qx 'de_DE.utf8'
      - name: Test
        run: cargo test --all-targets
      - name: Architecture invariants
        run: ./scripts/check-invariants.sh
      - name: Documentation is in sync
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          # On a push there is no pull request base; the pairing check still runs.
          ./scripts/check-docs-sync.sh $base

  commits:
    # Conventional Commits, checked on the commits a pull request actually adds.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check commit messages
        run: |
          pattern='^(feat|fix|docs|refactor|test|chore|ci|perf|build|revert)(\([a-z0-9./-]+\))?!?: .+'
          failed=0
          while read -r sha; do
            subject=$(git log -1 --format=%s "$sha")
            if ! printf '%s' "$subject" | grep -qE "$pattern"; then
              echo "not a Conventional Commit: $sha $subject"
              failed=1
            fi
          done < <(git rev-list ${{ github.event.pull_request.base.sha }}..HEAD --no-merges)
          exit $failed
        shell: bash

  install:
    # The path a user actually takes: a fresh checkout, then the manifest's build step.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Run the plugin build step
        run: ./scripts/fetch-or-build.sh
      - name: The binary runs
        run: |
          ./bin/herdr-worktree-nav 2>&1 | grep -q 'herdr-worktree-nav'
          # Without a herdr socket it must fail with an explanation, not a panic.
          if ./bin/herdr-worktree-nav dump 2>err.txt; then
            echo "expected a failure with no herdr socket"; exit 1
          fi
          grep -q 'HERDR_SOCKET_PATH' err.txt
