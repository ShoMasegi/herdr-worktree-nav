[package]
name = "herdr-worktree-nav"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Navigate herdr panes by repository and worktree, and turn any branch into a worktree pane."
license = "MIT"
repository = "https://github.com/ShoMasegi/herdr-worktree-nav"
readme = "README.md"
publish = false

[[bin]]
name = "herdr-worktree-nav"
path = "src/main.rs"

[profile.release]
# The binary is launched every time the picker opens, so favour a small, fast start.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
anyhow = "1.0.104"
dirs = "6.0.0"
nucleo-matcher = "0.3.1"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = { version = "1.0.7", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
insta = "1.48.0"
tempfile = "3.27.0"
